name: Docker 镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker Hub 仓库名（用户名/仓库）。用户名来自 Secrets，仓库名固定为 tgsub。
  DOCKERHUB_IMAGE: rdevils7/tgsub

permissions:
  contents: read
  packages: write

jobs:
  # 1) 先在 amd64 上构建并跑一次冒烟测试，确认镜像能起来、健康检查通过
  test:
    name: 构建并冒烟测试（amd64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tgsub:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并检查健康接口
        run: |
          docker run -d --name tgsub-smoke -p 6789:6789 tgsub:smoke
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6789/api/health > /tmp/health.json 2>/dev/null; then
              echo "健康检查通过：$(cat /tmp/health.json)"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:6789/api/health; then
            echo "容器未通过健康检查，日志如下："
            docker logs tgsub-smoke || true
            exit 1
          fi
          # 顺便确认页面能返回
          curl -fsS -o /dev/null -w "首页 HTTP %{http_code}\n" http://127.0.0.1:6789/
          docker rm -f tgsub-smoke

      - name: 验证两个持久化目录都能写（数据 / 下载分离）
        run: |
          mkdir -p "$RUNNER_TEMP/tgsub-data" "$RUNNER_TEMP/tgsub-downloads"
          chmod -R 777 "$RUNNER_TEMP/tgsub-data" "$RUNNER_TEMP/tgsub-downloads"
          docker run -d --name tgsub-vol \
            -v "$RUNNER_TEMP/tgsub-data:/data" \
            -v "$RUNNER_TEMP/tgsub-downloads:/downloads" \
            tgsub:smoke
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:6789/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          # 容器内以 node(1000) 运行，必须能往两个挂载点写
          # 显式指定 uid/gid：镜像不再写死 USER，docker exec 默认是 root，
          # 那样测不出降权之后是否还能写
          docker exec -u 1000:1000 tgsub-vol node -e "
            const fs = require('fs');
            fs.writeFileSync('/data/.probe', 'x');
            fs.writeFileSync('/downloads/.probe', 'x');
            console.log('dataDir/downloadDir 写入正常');
          " || { docker logs tgsub-vol; exit 1; }
          # 宿主机侧应能看到容器写入的文件，确认挂载生效
          test -f "$RUNNER_TEMP/tgsub-data/.probe" || { echo "数据目录未挂载生效"; exit 1; }
          test -f "$RUNNER_TEMP/tgsub-downloads/.probe" || { echo "下载目录未挂载生效"; exit 1; }
          echo "持久化目录校验通过"
          docker rm -f tgsub-vol

      - name: 验证 NAS 场景（挂载目录属主为 root）
        run: |
          # 群晖 / 威联通等 NAS 面板创建的挂载目录属主是 root，
          # 容器内应用以 node(1000) 运行会 EACCES 导致反复重启。
          # 入口脚本必须能自动把属主改掉并让容器正常起来。
          mkdir -p "$RUNNER_TEMP/nas-data" "$RUNNER_TEMP/nas-downloads"
          sudo chown -R root:root "$RUNNER_TEMP/nas-data" "$RUNNER_TEMP/nas-downloads"
          sudo chmod -R 755 "$RUNNER_TEMP/nas-data" "$RUNNER_TEMP/nas-downloads"

          docker run -d --name tgsub-nas \
            --restart unless-stopped \
            -p 6789:6789 \
            -v "$RUNNER_TEMP/nas-data:/data" \
            -v "$RUNNER_TEMP/nas-downloads:/downloads" \
            tgsub:smoke

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:6789/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            # 反复重启的典型特征：容器退出码 137/1 且被反复拉起
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "NAS 场景下容器未能正常启动，日志如下："
            docker logs tgsub-nas || true
            echo "重启次数：$(docker inspect -f '{{.RestartCount}}' tgsub-nas)"
            docker rm -f tgsub-nas || true
            exit 1
          fi

          # 容器不能陷入重启循环
          restarts=$(docker inspect -f '{{.RestartCount}}' tgsub-nas)
          if [ "$restarts" != "0" ]; then
            echo "容器发生了 $restarts 次重启，说明权限问题未解决"
            docker logs tgsub-nas
            docker rm -f tgsub-nas
            exit 1
          fi

          # 入口脚本应已把属主从 root 改成 1000:1000
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP/nas-data")
          if [ "$owner" != "1000:1000" ]; then
            echo "入口脚本未修正挂载目录属主，当前为 $owner，期望 1000:1000"
            docker logs tgsub-nas
            docker rm -f tgsub-nas
            exit 1
          fi

          # 降权后仍要能写
          docker exec -u 1000:1000 tgsub-nas node -e "
            const fs = require('fs');
            fs.writeFileSync('/data/.probe', 'x');
            fs.writeFileSync('/downloads/.probe', 'x');
          " || { docker logs tgsub-nas; exit 1; }

          echo "NAS 场景（root 属主挂载目录）校验通过"
          docker rm -f tgsub-nas

      - name: 验证镜像内置 ffmpeg 可用（已剥离 ffprobe，探测走 ffmpeg -i 解析）
        run: |
          # 镜像不再内置 ffprobe 二进制（省 75MB），元数据探测改用 ffmpeg -i 解析。
          # 这里确认 ffmpeg 仍在、且 -i 能正常输出媒体信息。
          docker run --rm --entrypoint sh tgsub:smoke -c '
            set -e
            FFMPEG=$(node -e "console.log(require(\"@ffmpeg-installer/ffmpeg\").path)")
            echo "ffmpeg 路径: $FFMPEG"
            "$FFMPEG" -version | head -1
            # 造一个 2 秒测试视频，确认 -i 能输出 Duration / Stream
            "$FFMPEG" -hide_banner -loglevel error -y \
              -f lavfi -i testsrc=duration=2:size=320x240:rate=25 \
              -c:v libx264 -preset ultrafast -pix_fmt yuv420p /tmp/t.mp4
            "$FFMPEG" -hide_banner -i /tmp/t.mp4 2>&1 | grep -E "Duration|Video:" || true
          ' | tee /tmp/ffmpeg-check.txt

          # 关键断言：-i 必须能输出 Duration 与 Video 流信息
          grep -q "Duration:" /tmp/ffmpeg-check.txt || { echo "ffmpeg -i 未输出 Duration，媒体信息探测会失效"; exit 1; }
          grep -q "Video:" /tmp/ffmpeg-check.txt || { echo "ffmpeg -i 未输出 Video 流信息"; exit 1; }
          echo "ffmpeg 内置二进制校验通过"

  # 2) 测试通过后再发布多架构镜像（amd64 + arm64）到 GHCR 与 Docker Hub
  publish:
    name: 发布到 GHCR + Docker Hub（amd64 + arm64）
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # job 级 env 可以引用 secrets，而步骤级 if 不行 ——
    # GitHub Actions 禁止在 if 条件里用 secrets 上下文，会让 workflow 整体解析失败。
    # 这里把 Docker Hub 凭据提到 job 级 env，下面的步骤就能用 env.DOCKERHUB_* 判断。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 用 Access Token 登录（不是账号密码）。
      #
      # 注意：**不能**在 if: 里直接判断 secrets —— GitHub Actions 禁止在
      # 步骤级 if 条件中引用 secrets 上下文，会导致整个 workflow 解析失败
      # （表现为 run 瞬间失败、没有任何 job）。因此把 Secret 透到 env，
      # 再用 env 判断。
      - name: 登录 Docker Hub
        id: dockerhub_login
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 计算镜像名（GHCR 要求全小写）
        id: slug
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 组装要推送的镜像地址列表。
      # Docker Hub 只在配了 Secret 时才加入 —— 否则标签里带着未登录的
      # registry 地址，push 阶段会直接失败，把整条流水线带崩。
      #
      # 注意：列表里**只能放镜像地址**。metadata-action 会把每一行都当成
      # 镜像名处理，混入提示语会报 "invalid reference format"。
      # 提示信息写到 stderr（不进 GITHUB_OUTPUT），日志里照样能看到。
      - name: 组装镜像地址列表
        id: images
        run: |
          {
            echo "list<<EOF"
            echo "${REGISTRY}/${GITHUB_REPOSITORY,,}"
            if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
              echo "${DOCKERHUB_IMAGE}"
            else
              echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次仅发布到 GHCR" >&2
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出拉取命令
        run: |
          echo "=== Docker Hub（推荐，国内拉取更快）==="
          echo "拉取：docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}"
          echo "拉取：docker pull ${{ env.DOCKERHUB_IMAGE }}:latest"
          echo ""
          echo "=== 国内拉不动时：配镜像加速器后用同样的命令 ==="
          echo "群晖：Container Manager → 注册表 → 设置 → 新增 → https://docker.1ms.run"
          echo "或改 compose 的 image 为 docker.1ms.run/${{ env.DOCKERHUB_IMAGE }}:latest"
          echo ""
          echo "=== GHCR（备用）==="
          echo "拉取：docker pull ${{ env.REGISTRY }}/${{ steps.slug.outputs.name }}:${{ steps.meta.outputs.version }}"
