services:
  tgsub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可改为 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: tgsub:1.0.0
    container_name: tgsub
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 加密 Telegram session 的密钥；留空则首次启动自动生成并保存在 /data
      SESSION_SECRET: ${SESSION_SECRET:-}
      # 可选的基础认证，暴露到公网时建议开启
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
    volumes:
      # 宿主机 ./data 下同时存放数据库与下载的文件
      # Linux 首次部署请先执行：mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # 可选：需要走 SOCKS5 代理访问 Telegram 时，可复用宿主机上的代理服务
  # 在设置页填写 socks5://host.docker.internal:7897 即可
