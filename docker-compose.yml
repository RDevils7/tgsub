# tgsub 部署配置 —— 直接拉取 Docker Hub 镜像，不在本机编译
#
#   docker compose up -d
#
# 镜像地址：rdevils7/tgsub:latest
# 需要固定版本时，把下面 image 改成 rdevils7/tgsub:v1.3.17
#
# 备用仓库（GHCR，国内拉取可能较慢，拉不动时再换）：
#   image: ghcr.io/rdevils7/tgsub:latest
#
# 本文件全部使用真实值，不做变量插值。直接改下面的字段即可：
#   image        → 换镜像版本
#   ports        → 换宿主机端口
#   volumes      → 换两个持久化目录
#   environment  → 改时区 / 日志级别 / 认证 / session 密钥 / 运行用户
#
# 持久化目录（两个目录可分别指向不同磁盘）：
#   ./data      → 容器 /data      数据库、加密 session、封面缓存、临时截图
#   ./downloads → 容器 /downloads 实际下载的视频 / 图片 / 剧集目录
# 下载目录通常占空间，建议指向大容量盘。
#
# 首次部署（Linux）：
#   mkdir -p data downloads && sudo chown -R 1000:1000 data downloads
#
# NAS（群晖 / 威联通 / 绿联 / 铁威马等）部署：
#   面板自动创建的挂载目录属主是 root，容器内应用以 node(1000) 运行，
#   会出现「容器反复重启 + EACCES: permission denied, open '/data/.session-secret'」。
#   本镜像的入口脚本会自动把目录属主改成下面 PUID/PGID 对应的用户，无需手动 chown。
#   若面板不允许面板改属主，把 PUID/PGID 改成 NAS 上对应账号的 uid/gid
#   （SSH 执行 id <用户名> 查看），例如 NAS 用户是 admin(1026)：
#     environment:
#       PUID: "1026"
#       PGID: "100"
#
# 国内拉取慢/卡住时，用 Docker Hub 镜像加速器（在 NAS 的「设置 → 常规 → 镜像加速」里填）：
#   https://docker.1ms.run          ← 实测可用，速度最好
#   https://docker.1panel.live      ← 实测可用，备用
#   https://docker.m.daocloud.io    ← 实测可用，备用
#
# 群晖也可 SSH 编辑 /var/packages/ContainerManager/etc/dockerd.json，写入：
#   { "registry-mirrors": ["https://docker.1ms.run", "https://docker.1panel.live"] }
# 然后重启：sudo synoservicectl --restart pkgctl-ContainerManager
#
# 只想改本项目、不动 NAS 全局设置，就在下面的 image: 前面加加速器前缀：
#   image: docker.1ms.run/rdevils7/tgsub:latest
#
# 实在拉不动（网络受限）：在有 Docker 的电脑上
#   docker pull rdevils7/tgsub:latest && docker save rdevils7/tgsub:latest -o tgsub.tar
# 传到 NAS 后执行 docker load -i tgsub.tar，再 docker compose up -d
#
# 从旧版本（下载文件在 ./data/downloads 内）升级：
#   mv data/downloads/* downloads/ && rmdir data/downloads

services:
  tgsub:
    image: rdevils7/tgsub:latest
    container_name: tgsub
    restart: unless-stopped
    # 硬件转码（可选，推荐）：把宿主机核显映射进容器，浏览器解不了的编码（HEVC / H.265、
    # ProRes 等）改由显卡实时解码 + 编码成 H.264，CPU 基本不烧。
    # N100 / N305 / 群晖带 Intel 核显的机型都支持；宿主机没有 /dev/dri（ARM NAS、VPS）时
    # **不要**放开下面一行，否则容器会因为找不到设备起不来。
    # 只需要放开 devices —— 入口脚本会读 /dev/dri 设备节点的属组，自动加进运行用户的补充组。
    # 不要写 group_add: ["video", "render"]：Docker 按宿主机 /etc/group 解析组名，
    # 群晖 / 威联通 / 绿联的组文件里没有 render 组，会直接报
    #   unable to find group render: no matching entries in group file
    # 容器连创建都失败（1.3.9 起已改为容器内自动处理，不再需要 group_add）。
    # devices:
    #   - /dev/dri:/dev/dri
    # 不要加 init: true —— 镜像的 ENTRYPOINT 已经用 tini 做 PID 1，
    # 再叠加一层会出现「Tini is not running as PID 1」警告并多占一个进程。
    ports:
      # 宿主机端口 → 容器端口
      - "6789:6789"
    environment:
      TZ: Asia/Shanghai
      # ① 数据持久化目录（容器内）
      DATA_DIR: /data
      # ② 下载目录（容器内）
      DOWNLOAD_DIR: /downloads
      LOG_LEVEL: info
      # 容器内运行用户（uid:gid）。入口脚本用它修正挂载目录属主，再降权运行。
      # NAS 上若挂载目录属主是别的账号，改成对应账号的 uid/gid。
      PUID: "1000"
      PGID: "1000"
      # 加密 Telegram session 的密钥；留空则首次启动自动生成并保存在 /data
      SESSION_SECRET: ""
      # 可选的基础认证，暴露到公网时建议开启
      BASIC_AUTH_USER: ""
      BASIC_AUTH_PASS: ""
      # 管理界面登录是应用自带的（首次打开网页时强制设置账号密码），正常情况下不用管这里。
      # 忘记密码时才临时加下面一行（关闭登录）→ 重启 → 在设置页重设 → 删掉再重启：
      # AUTH_DISABLED: "1"
    volumes:
      # ① 数据持久化目录：数据库 tgsub.db、加密 session、封面缓存、临时截图
      #    换容器、重装镜像都不丢；备份这个目录即可恢复全部配置与记录
      - ./data:/data
      # ② 下载目录：实际下载的媒体文件（视频 / 图片 / nfo / 封面）
      #    可单独挂到另一块大盘上，容器删除后文件仍在
      - ./downloads:/downloads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6789/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
