<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>tgsub · Telegram 频道关键词订阅</title>
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      在 React 挂载前先定好主题，避免刷新时先闪一下默认深色。
      与 src/hooks/useTheme.ts 里的规则保持一致：优先读 localStorage，其次跟随系统。
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("tgsub-theme");
          var light = saved === "light" || (!saved && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", !light);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {
          /* 忽略：默认深色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
