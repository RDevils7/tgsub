<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>tgsub · Telegram 频道关键词订阅</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%232aabee'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 16.4l17-6.6-2.6 15.2-6.1-4.3-3 3-.5-4.9z' fill='white'/%3E%3C/svg%3E"
    />
    <!--
      在 React 挂载前先定好主题，避免刷新时先闪一下默认深色。
      与 src/hooks/useTheme.ts 里的规则保持一致：优先读 localStorage，其次跟随系统。
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("tgsub-theme");
          var light = saved === "light" || (!saved && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", !light);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {
          /* 忽略：默认深色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
