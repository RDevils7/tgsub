# 本地构建镜像后部署（会在这台机器上跑一遍依赖安装 + 前端打包，耗时较长）
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# 只想用现成镜像？请改用默认的 docker-compose.yml（拉取 ghcr.io/rdevils7/tgsub:latest）。
#
# 本文件全部使用真实值，不做变量插值。直接改下面的字段即可。
#
# 持久化目录与默认 compose 完全一致：
#   ./data      → 容器 /data      数据库、加密 session、封面缓存、临时截图
#   ./downloads → 容器 /downloads 实际下载的视频 / 图片 / 剧集目录

services:
  tgsub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可改为 https://registry.npmmirror.com
        NPM_REGISTRY: https://registry.npmjs.org
    image: tgsub:local
    container_name: tgsub
    restart: unless-stopped
    # 不要加 init: true —— 镜像的 ENTRYPOINT 已经用 tini 做 PID 1
    ports:
      # 宿主机端口 → 容器端口
      - "6789:6789"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      LOG_LEVEL: info
      # 容器内运行用户（uid:gid），入口脚本用它修正挂载目录属主后降权运行
      PUID: "1000"
      PGID: "1000"
      SESSION_SECRET: ""
      BASIC_AUTH_USER: ""
      BASIC_AUTH_PASS: ""
    volumes:
      # ① 数据持久化目录
      - ./data:/data
      # ② 下载目录
      - ./downloads:/downloads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6789/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
